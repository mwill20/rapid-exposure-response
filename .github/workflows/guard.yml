name: guard
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Leak guard
        run: bash scripts/guard.sh
      - name: Cross-reference checker (with should-fail test)
        run: bash scripts/test_check_refs.sh
  updater:
    name: Work-side updater (PSScriptAnalyzer + Pester)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze and test under PowerShell 7
        shell: pwsh
        run: ./work-side/Test-Updater.ps1
      - name: Analyze and test under Windows PowerShell 5.1
        shell: powershell
        run: ./work-side/Test-Updater.ps1
