name: release
# Publishes a release whenever VERSION changes on main (or on manual run).
# Attests build provenance for the zip, verifies the attestation, then runs
# the work-side updater against the real release.
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the provenance attestation
      attestations: write    # store the attestation
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      published: ${{ steps.exists.outputs.skip == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve version
        id: v
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Skip if release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Leak guard
        if: steps.exists.outputs.skip == 'false'
        run: bash scripts/guard.sh
      - name: Cross-reference checker
        if: steps.exists.outputs.skip == 'false'
        run: python3 scripts/check_refs.py
      - name: Install tools
        if: steps.exists.outputs.skip == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc zip
          pip install openpyxl==3.1.5
      - name: Build kit
        if: steps.exists.outputs.skip == 'false'
        run: bash scripts/build.sh
      - name: Attest build provenance
        if: steps.exists.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/rer-kit-${{ steps.v.outputs.tag }}.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          gh release create "$TAG" "dist/rer-kit-$TAG.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "RER Kit $TAG" \
            --notes "See CHANGELOG.md. Verify SHA256 and provenance before use: gh attestation verify rer-kit-$TAG.zip --repo ${{ github.repository }}"
      - name: Verify the attestation of the published asset
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "rer-kit-$TAG.zip"
          gh attestation verify "rer-kit-$TAG.zip" --repo "${{ github.repository }}"

  verify-updater-live:
    # End-to-end proof: the read-only updater downloads, verifies and extracts the release just published.
    needs: build
    if: needs.build.outputs.published == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Live updater run (Windows PowerShell 5.1)
        shell: powershell
        run: ./work-side/Test-Updater.ps1 -Live -Owner "${{ github.repository_owner }}" -Repo "${{ github.event.repository.name }}"
